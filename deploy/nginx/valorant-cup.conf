server {
    listen 80;
    server_name valorant-cup.dosthrk.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/valorant-cup/current;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name valorant-cup.dosthrk.com;

    root /var/www/valorant-cup/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/valorant-cup.dosthrk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/valorant-cup.dosthrk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VALORANT_CUP_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/valorant-cup.access.log;
    error_log /var/log/nginx/valorant-cup.error.log;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://media.valorant-api.com data: blob:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /traffic/ {
        access_log /var/log/nginx/valorant-cup-analytics.access.log;
        return 302 /traffic;
    }

    location = /traffic {
        alias /var/www/valorant-cup-analytics/index.html;
        default_type text/html;

        auth_basic "VALORANT-CUP Traffic";
        auth_basic_user_file /etc/nginx/valorant-cup-analytics.htpasswd;

        access_log /var/log/nginx/valorant-cup-analytics.access.log;
        add_header Cache-Control "no-store" always;
        # GoAccess compiles its bundled HTML templates with new Function().
        add_header Content-Security-Policy "default-src 'self' data:; img-src 'self' data:; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
