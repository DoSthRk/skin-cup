server {
    listen 80;
    server_name valorant-cup.dosthrk.com;

    root /var/www/valorant-cup/current;
    index index.html;

    access_log /var/log/nginx/valorant-cup.access.log;
    error_log /var/log/nginx/valorant-cup.error.log;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
